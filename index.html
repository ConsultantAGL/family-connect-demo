<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Family Connect | Interactive Concept</title><style>
:root{--ink:#183349;--muted:#657b8a;--teal:#087f83;--light:#eaf7f5;--bg:#f4f7f9;--border:#dce7eb;--white:#fff;--gold:#fff5df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:3}.top{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;flex-wrap:wrap}.brand{font-size:21px;font-weight:800;color:#12666e}.brand small{font-size:11px;font-weight:500;color:var(--muted);display:block}.role{display:flex;align-items:center;gap:8px}.role select{padding:9px;border:1px solid var(--border);border-radius:10px;background:white}.layout{max-width:1180px;margin:22px auto;padding:0 18px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px}aside{background:white;border:1px solid var(--border);border-radius:17px;padding:16px;height:fit-content;position:sticky;top:94px}aside .nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:12px;border-radius:9px;margin:3px 0}aside .nav.active{background:var(--light);color:var(--teal);font-weight:750}.note{font-size:12px;line-height:1.5;color:var(--muted);margin-top:20px;border-top:1px solid var(--border);padding-top:16px}main{min-width:0}.hero{background:linear-gradient(120deg,#126b73,#218f91);color:white;border-radius:20px;padding:24px 28px;display:flex;justify-content:space-between;gap:15px;align-items:center}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;opacity:.93}.pill{display:inline-block;padding:6px 11px;border-radius:30px;background:#e9f6f2;color:#176c63;font-size:12px;font-weight:750}.hero .pill{background:#d8f7ef}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}.card{background:white;border:1px solid var(--border);border-radius:16px;padding:20px;min-width:0}.card.wide{grid-column:1/-1}.card h2{font-size:17px;margin:0 0 10px}.card p{line-height:1.55;color:var(--muted);margin:7px 0}.kpi{font-size:27px;font-weight:800;color:#146d75}.muted{color:var(--muted);font-size:13px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf2f3}.item:last-child{border-bottom:0}.item strong{display:block}.item small{display:block;color:var(--muted);margin-top:3px}.btn{border:0;background:var(--teal);color:white;padding:10px 14px;border-radius:10px;font-weight:700}.btn.secondary{background:var(--light);color:var(--teal)}.btn.outline{border:1px solid var(--border);background:white;color:var(--ink)}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tag{background:#edf3f5;border-radius:8px;padding:5px 8px;font-size:12px;color:#506879}.timeline{display:flex;gap:10px;flex-wrap:wrap}.day{border:1px solid var(--border);background:white;border-radius:12px;padding:12px;min-width:75px;text-align:center}.day.active{background:var(--light);border-color:var(--teal)}.day strong{display:block}.day span{font-size:12px;color:var(--muted)}.formrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}input,textarea{border:1px solid var(--border);border-radius:10px;padding:11px;max-width:100%}textarea{width:100%;min-height:90px}.notice{background:#fff8e9;border:1px solid #f0dfbb;border-radius:12px;padding:12px;color:#73572a;font-size:13px;margin-top:12px}.empty{padding:20px;text-align:center;color:var(--muted)}.footer{max-width:1180px;margin:0 auto 28px;padding:0 18px;font-size:12px;color:var(--muted)}.modal-back{position:fixed;inset:0;background:#102c3a99;display:none;align-items:center;justify-content:center;z-index:10;padding:15px}.modal{background:white;border-radius:18px;padding:22px;width:min(480px,100%)}.modal h2{margin:0 0 10px}.modal .btn{margin-top:10px}.hidden{display:none!important}@media(max-width:750px){.layout{display:block;margin:12px auto;padding:0 12px}aside{position:static;display:flex;overflow-x:auto;gap:4px;margin-bottom:12px;padding:7px}aside .nav{white-space:nowrap;width:auto;padding:10px}aside .note{display:none}.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.hero{padding:19px}.hero h1{font-size:22px}.top{padding:12px}.brand{font-size:18px}}
</style></head><body><header><div class="top"><div class="brand">✦ Family Connect <small>Care visibility · Daily engagement · Peace of mind</small></div><div class="role"><label for="role">Demo view</label><select id="role" onchange="setRole(this.value)"><option value="family">Family member</option><option value="resident">Resident</option><option value="facility">Facility coordinator</option></select></div></div></header><div class="layout"><aside id="sidebar"></aside><main id="app"></main></div><div class="footer">Interactive sales concept · Illustrative names and data only · No live clinical information, billing, or EHR integration. Features marked “Future” are not in the proposed MVP.</div><div class="modal-back" id="back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="btn secondary" onclick="closeModal()">Close</button></div></div><script>
const state={role:'family',tab:'home',day:2,done:{},updates:[{title:'Morning movement session',detail:'Attended with the activity group',time:'Today · 9:30 AM'},{title:'Lunch update',detail:'Meal served according to the current meal plan',time:'Today · 12:30 PM'},{title:'Family check-in',detail:'Video call requested for Friday',time:'Yesterday'}],messages:[],mood:'',consent:true};
const nav={family:[['home','Overview'],['calendar','Activities'],['updates','Care updates'],['connect','Connect'],['preferences','Sharing preferences']],resident:[['home','My day'],['calendar','My activities'],['unwind','Unwind'],['connect','Family'],['preferences','My choices']],facility:[['home','Worklist'],['calendar','Schedule'],['updates','Post update'],['connect','Requests'],['preferences','Permissions']]};
function setRole(role){state.role=role;state.tab='home';render()}function go(tab){state.tab=tab;render()}function box(title,body,wide=''){return `<section class="card ${wide}"><h2>${title}</h2>${body}</section>`}function action(label,fn,secondary=false){return `<button class="btn ${secondary?'secondary':''}" onclick="${fn}">${label}</button>`}function item(title,detail,right=''){return `<div class="item"><div><strong>${title}</strong><small>${detail}</small></div>${right}</div>`}function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('back').style.display='flex'}function closeModal(){document.getElementById('back').style.display='none'}function notice(){modal('Demo confirmation','<p>This is a prototype. No real notification or appointment has been sent.</p>')}
function render(){document.getElementById('sidebar').innerHTML=nav[state.role].map(([id,label])=>`<button class="nav ${state.tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')+`<div class="note"><strong>Prototype navigation</strong><p>Switch roles at the top to explore what each person can see. All data is fictional.</p></div>`;let fn=pages[state.role][state.tab]||pages[state.role].home;document.getElementById('app').innerHTML=fn()}
function hero(title,desc,badge){return `<div class="hero"><div><h1>${title}</h1><p>${desc}</p></div><span class="pill">${badge}</span></div>`}function calendar(){return `<div class="timeline">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<button class="day ${state.day===i?'active':''}" onclick="state.day=${i};render()"><strong>${d}</strong><span>${12+i} Oct</span></button>`).join('')}</div><div class="grid">${box('Selected day · '+['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][state.day],state.day===2?item('9:30 AM · Gentle movement','Group session · Activity room',`<span class="tag">Scheduled</span>`)+item('12:30 PM · Lunch','Balanced meal plan · Dining hall')+item('3:00 PM · Music & memories','Social activity · Lounge'):item('10:00 AM · Group activity','Illustrative session')+item('1:00 PM · Lunch','Meal plan reminder'))}${box('Care-plan connection','<p>Facility staff schedule activities based on an approved plan. Instructors receive only the instructions needed for safe participation, not unrestricted medical records.</p>')}</div>`}
const pages={family:{home:()=>hero('Good morning, Alex','Here is a simple view of how Margaret is doing at Willow Grove Care.','Family view')+`<div class="grid">${box('At a glance','<div class="kpi">Doing well today</div><p>Daily activities are on track. No new update requiring family action.</p><span class="muted">General care update, not a medical assessment</span>')}${box('Today’s activities',item('Gentle movement','9:30 AM · Attended')+item('Music & memories','3:00 PM · Upcoming')+`<div class="actions">${action('View calendar',"go('calendar')",true)}</div>`)}${box('Latest care updates',state.updates.slice(0,2).map(x=>item(x.title,x.detail)).join('')+`<div class="actions">${action('All updates',"go('updates')",true)}</div>`)}${box('Stay connected','<p>Send a message or request a convenient time for a family call.</p>'+`<div class="actions">${action('Message care team',"go('connect')")}</div>`)}${box('Health information · optional','<p>The original concept includes health trends, medication adherence and alerts. For the first demo, the family sees only approved, plain-language care updates.</p><span class="tag">Detailed vitals hidden by default</span>','wide')}</div>`,calendar:()=>hero('Activities','See what is planned, completed and enjoyed.','Family view')+calendar(),updates:()=>hero('Care updates','A readable timeline of approved resident updates.','Family view')+`<div class="grid">${box('Recent updates',state.updates.map(x=>item(x.title,x.detail+' · '+x.time)).join(''),'wide')}${box('Feedback','<p>Share an observation or question with the facility team.</p>'+`<textarea id="feedback" placeholder="Write a question or observation..."></textarea><div class="actions">${action('Send feedback',"sendFeedback()")}</div>`,'wide')}</div>`,connect:()=>connectPage('family'),preferences:()=>hero('Sharing preferences','Resident-directed access, with appropriate representative permissions.','Family view')+`<div class="grid">${box('What this demo shows',item('Activity schedule','Visible to approved family contacts')+item('General care updates','Visible when sharing is authorized')+item('Detailed vitals','Not shown in this family MVP'))}${box('Privacy first','<p>Real access depends on resident authorization, applicable law, facility policies and relationship verification. Family status alone does not grant automatic access to PHI.</p>')}</div>`},resident:{home:()=>hero('Hello, Margaret!','Your day, your pace. Choose what you feel like doing.','Resident view')+`<div class="grid">${box('Up next','<div class="kpi">3:00 PM</div><p>Music & memories in the lounge</p>'+`<div class="actions">${action('My activities',"go('calendar')")}</div>`)}${box('Today’s meals',item('Breakfast','Completed')+item('Lunch','12:30 PM · Dining hall')+item('Dinner','6:00 PM · Dining hall'))}${box('Time to unwind','<p>Try a short breathing exercise, a puzzle, or a relaxing video.</p>'+`<div class="actions">${action('Open Unwind',"go('unwind')")}</div>`)}${box('How are you feeling?','<p>Sharing is optional.</p><div class="actions">'+['Good','Okay','Not great'].map(x=>action(x,`mood('${x}')`,true)).join('')+'</div>'+(state.mood?`<p class="muted">Selected: ${state.mood}</p>`:'') )}${box('My choices','<p>You can skip activities, ask for assistance, or choose not to use the app. Staff can continue supporting you in person.</p>','wide')}</div>`,calendar:()=>hero('My activities','A gentle reminder, never a requirement.','Resident view')+calendar()+`<div class="actions">${action('I need help with an activity',"modal('Ask for help','<p>In a real deployment, this would send a request to authorized staff. This prototype sends nothing.</p>')",true)}</div>`,unwind:()=>hero('Unwind','Take a moment for yourself. All activities are optional.','Resident view')+`<div class="grid">${box('Guided breathing · 2 minutes','<p>A simple on-screen breathing exercise for relaxation.</p>'+`<div class="actions">${action('Start',"breathing()")}</div>`)}${box('Mini word game','<p>Rearrange the letters: <strong>MLAC</strong></p><div class="formrow"><input id="word" placeholder="Your answer" aria-label="Word answer">${action('Check',"checkWord()")}</div>`)}${box('Curated videos · Future','<p>Approved, calm and interesting content, without an open social-media feed.</p><span class="tag">Concept only</span>')}${box('Partner apps · Future','<p>Optional licensed cognitive games and meditation subscriptions, subject to commercial agreements and technical integration rights.</p><span class="tag">Concept only</span>')}</div>`,connect:()=>connectPage('resident'),preferences:()=>hero('My choices','Your comfort and preferences come first.','Resident view')+`<div class="grid">${box('Participation','<p>Activities, puzzles and meditation are optional. Staff can provide reminders or help without requiring a smartphone.</p>')}${box('Sharing','<p>Residents or authorized representatives can decide which family contacts receive appropriate updates, subject to applicable rules.</p>')}</div>`},facility:{home:()=>hero('Facility coordination','Post relevant updates once; families see only what they are permitted to see.','Facility view')+`<div class="grid">${box('Today’s tasks',item('Movement group','9:30 AM · Marked attended')+item('Music & memories','3:00 PM · Upcoming')+item('Family call request','Friday · Awaiting coordination'))}${box('Quick actions',`<div class="actions">${action('Post an update',"go('updates')")}${action('Manage schedule',"go('calendar')",true)}</div><p>Simple coordinator workflow, not a full clinical dashboard.</p>`)}${box('Sharing guardrails','<p>Staff can post general activity and well-being updates. Medical notes, vitals, diagnoses and medication details require separate authorization and clinical workflows.</p>','wide')}</div>`,calendar:()=>hero('Activity schedule','Coordinate approved nonclinical activities.','Facility view')+calendar(),updates:()=>hero('Post an update','Publish a simple resident update to approved recipients.','Facility view')+`<div class="grid">${box('New care update','<p>Use general, nonclinical language.</p><input id="updateTitle" placeholder="Update title" style="width:100%"><textarea id="updateText" placeholder="What happened? (No diagnoses or raw vitals)"></textarea><div class="actions">${action('Add demo update',"addUpdate()")}</div><div class="notice">Prototype only. Production requires permissions, review rules, audit logging and appropriate handling of PHI.</div>','wide')}${box('Published updates',state.updates.map(x=>item(x.title,x.detail)).join(''),'wide')}</div>`,connect:()=>connectPage('facility'),preferences:()=>hero('Access & permissions','Different tasks do not require identical data access.','Facility view')+`<div class="grid">${box('Coordinator','<p>Schedules, attendance, approved family updates and contact requests.</p>')}${box('Clinical team','<p>Clinical data remains in authorized systems and workflows. This concept does not create blanket access for activity instructors.</p>')}${box('External instructor · Future','<p>Only assigned sessions and safety instructions approved for the task, if access is necessary. No default raw-vitals access.</p>','wide')}</div>`}};
function connectPage(role){return hero(role==='resident'?'Stay in touch':role==='facility'?'Family requests':'Connect with the care team','Keep communication simple and respectful of resident preferences.',role==='resident'?'Resident view':role==='facility'?'Facility view':'Family view')+`<div class="grid">${box('Contacts',item('Care coordination desk','General questions and updates',action('Message',"messageModal()",true))+item(role==='resident'?'Family contact':'Family contact','Call scheduling',action('Request call',"notice()",true)))}${box('Recent messages',state.messages.length?state.messages.map(x=>item(x,'Demo message · Not sent')).join(''):'<p>No messages in this demo session.</p>')}</div>`}function messageModal(){modal('Write a demo message','<textarea id="msg" placeholder="Type your message..."></textarea><button class="btn" onclick="sendMessage()">Save demo message</button>')}function sendMessage(){let x=document.getElementById('msg').value.trim();if(!x)return;state.messages.unshift(x);closeModal();render()}function sendFeedback(){let x=document.getElementById('feedback').value.trim();if(x)modal('Feedback saved in demo','<p>Your example feedback was captured locally for this session. Nothing was transmitted.</p>')}function addUpdate(){let title=document.getElementById('updateTitle').value.trim(),detail=document.getElementById('updateText').value.trim();if(!title||!detail){modal('Missing information','<p>Enter both a title and description.</p>');return}state.updates.unshift({title,detail,time:'Just now · Demo'});render()}function mood(x){state.mood=x;render()}function checkWord(){modal('Word game',document.getElementById('word').value.trim().toUpperCase()==='CALM'?'<p>Correct! CALM.</p>':'<p>Try again. Hint: a peaceful feeling.</p>')}function breathing(){modal('Guided breathing','<p style="font-size:22px;text-align:center">Breathe in gently for 4 counts.<br>Pause if comfortable.<br>Breathe out slowly for 4 counts.</p><p>Repeat only as comfortable. Stop if you feel unwell.</p>')}render();
</script></body></html>
